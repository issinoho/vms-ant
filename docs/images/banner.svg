<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Apache Ant for OpenVMS">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
