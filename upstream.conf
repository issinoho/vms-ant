# Upstream Apache Ant release this port is built from: the binary distribution,
# verified against its SHA-512 and the release manager's signature.
UPSTREAM_NAME=apache-ant
UPSTREAM_VERSION=1.10.18
UPSTREAM_URL=https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.18-bin.tar.gz
UPSTREAM_SHA512=c510d744876d8da48dabc9495b023b6ec5284a0f18b40ee50d98ce099e791ca5c73e3cd4c80d3c90d3efc03f9620be43aad0a373ed47198284f7e3373e0db2c3
# Stefan Bodewig, from https://downloads.apache.org/ant/KEYS
# Public key: keys/ant-signing-key.asc
UPSTREAM_GPG_KEY=BC26C53AF531F8B4B3F5930AAFBD3AF8EAFA72DA
VMS_PATCH_LEVEL=1
# The signed source distribution (same signer): the source of the classes the
# patches change. prepare.sh unpacks just those files into vmsport/src/ant/;
# BUILD.COM compiles them on the node and puts the classes into lib/ant.jar.
SOURCE_URL=https://archive.apache.org/dist/ant/source/apache-ant-1.10.18-src.tar.gz
SOURCE_SHA512=a0719823def0828e0eb1e448b2e948b6be202b53461aa04c1c6b63268bcaa9b72e2086d74814421bcc6f9b9b6ff1d9c03df67840e89735d00cd140a4639a27eb
# Java: Ant 1.10 runs on Java 8, which both nodes have (VSI OpenJDK 8).
# Kit: the product is ANT with ANT$ROOT (DECISIONS D3).
KIT_PRODUCT=ANT
